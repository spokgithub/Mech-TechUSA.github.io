<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mech-Tech USA, LLC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;

            /* Background image */
            background-image: url("background.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;

            /* Center content */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            text-align: center;
            line-height: 1.6;
            color: #333;

            /* White overlay */
            background: rgba(255, 255, 255, 0.90);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
        }

        h1 {
            color: #003366;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background-color: #0078d4;
            color: white;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        .button:hover {
            background-color: #005ea6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Mech-Tech USA, LLC</h1>

        <div class="subtitle">
            Brecksville, Ohio<br>
            
        </div>

        <p>
            More information coming soon
            
            
        </p>

        <a class="button"
           href="https://forms.cloud.microsoft/r/gvZWtfNEtT"
           target="_blank"
           rel="noopener noreferrer">
            Contact Us
        </a>
    </div>

</body>
</html>
